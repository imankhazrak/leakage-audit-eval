[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakagelens"
version = "0.1.0"
description = "Refit-based audit library and planted-leakage evaluation suite for tabular supervised-learning pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Anonymous authors (under double-blind review)" },
]
keywords = ["data-leakage", "machine-learning", "tabular", "evaluation", "benchmark", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
gbdt = ["lightgbm>=4.0"]
data = ["openml>=0.14", "pyarrow>=14.0"]
notebooks = ["jupyter>=1.0", "nbclient>=0.8"]
all = ["pytest>=7.4", "lightgbm>=4.0", "openml>=0.14", "pyarrow>=14.0", "jupyter>=1.0", "nbclient>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leakagelens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "slow: checks every file of the experiment tree against its recorded hash",
]
